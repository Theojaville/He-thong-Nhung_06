; ================================================================
;  HỆ THỐNG ĐẾM NGƯỜI RA VÀO PHÒNG — ESP32-CAM (All-in-One)
;  Nhóm 6 | Framework: Arduino Core | Board: AI-Thinker ESP32-CAM
; ================================================================

[env:esp32s3cam]
build_type = debug

platform = espressif32@^6.4.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600
monitor_filters = esp32_exception_decoder

; --- Cấu hình bộ nhớ cho ESP32-S3 N16R8 (16MB Flash, 8MB PSRAM OPI) ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; --- Phân vùng flash: 16MB (tối đa cho ứng dụng chứa model AI) ---
board_build.partitions = default_16MB.csv

; --- Build flags ---
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -Os                         ; Tối ưu kích thước binary

; --- Thư viện ---
lib_deps =
    ; TensorFlow Lite Micro cho ESP32 (Arduino wrapper)
    https://github.com/tanakamasayuki/Arduino_TensorFlowLite_ESP32.git
    ; Lưu ý: Nếu lib trên lỗi phiên bản, thay bằng:
    ;   https://github.com/eloquentarduino/EloquentTinyML.git

